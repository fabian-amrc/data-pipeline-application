apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data-pipeline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Data pipeline platform applications managed with the app-of-apps pattern.
  sourceRepos:
    - https://github.com/fabian-amrc/data-pipeline-application.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
