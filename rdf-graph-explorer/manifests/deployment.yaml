apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdf-graph-explorer
  labels:
    app.kubernetes.io/name: rdf-graph-explorer
    app.kubernetes.io/part-of: semantic-layer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rdf-graph-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdf-graph-explorer
        app.kubernetes.io/part-of: semantic-layer
    spec:
      containers:
        - name: rdf-graph-explorer
          image: data-pipeline-rdf-graph-explorer:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
