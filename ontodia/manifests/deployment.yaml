apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontodia
  labels:
    app.kubernetes.io/name: ontodia
    app.kubernetes.io/part-of: semantic-layer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontodia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontodia
        app.kubernetes.io/part-of: semantic-layer
    spec:
      containers:
        - name: ontodia
          image: aksw/ontodia:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ENDPOINT_URL
              value: /fuseki/semantic/sparql
            - name: LUCENE_SEARCH
              value: "no"
            - name: USE_CREDS
              value: "yes"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
