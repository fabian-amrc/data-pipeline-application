apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark-jobs
  namespace: argocd
spec:
  project: data-pipeline
  source:
    repoURL: https://github.com/fabian-amrc/data-pipeline-application.git
    targetRevision: HEAD
    path: spark/spark-jobs
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: spark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
