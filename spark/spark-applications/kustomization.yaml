apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark-jobs
resources:
  - applications/spark-pi/spark-pi-sparkapplication.yaml
  - applications/uc-smoke-test/uc-smoke-test-sparkapplication.yaml
configMapGenerator:
  - name: uc-smoke-test-script
    files:
      - uc_smoke_test.py=applications/uc-smoke-test/uc_smoke_test.py
patches:
  - path: patches/common-spark-conf.yaml
    target:
      group: sparkoperator.k8s.io
      version: v1beta2
      kind: SparkApplication

generatorOptions:
  disableNameSuffixHash: true
