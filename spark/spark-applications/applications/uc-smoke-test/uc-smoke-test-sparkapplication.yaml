apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: unity-catalog-smoke-test
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  image: data-pipeline-spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/uc_smoke_test.py
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  volumes:
    - name: uc-smoke-test-script
      configMap:
        name: uc-smoke-test-script
        defaultMode: 0555
  driver:
    cores: 1
    memory: 1g
    labels:
      version: 3.5.3
    serviceAccount: spark-operator-spark
    volumeMounts:
      - name: uc-smoke-test-script
        mountPath: /app/uc_smoke_test.py
        subPath: uc_smoke_test.py
  executor:
    cores: 1
    instances: 1
    memory: 1g
    labels:
      version: 3.5.3
    volumeMounts:
      - name: uc-smoke-test-script
        mountPath: /app/uc_smoke_test.py
        subPath: uc_smoke_test.py
