apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: semantic-delta-test
  namespace: spark-jobs
spec:
  type: Python
  mode: cluster
  image: data-pipeline-spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///app/semantic_delta_test.py
  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never
  volumes:
    - name: semantic-delta-test-script
      configMap:
        name: semantic-delta-test-script
        defaultMode: 0555
    - name: minio-tenant-env
      secret:
        secretName: myminio-env-configuration
  driver:
    cores: 1
    memory: 1g
    labels:
      version: 3.5.3
    serviceAccount: spark-operator-spark
    env:
      - name: MINIO_CONFIG_ENV_FILE
        value: /var/run/minio-tenant/config.env
    volumeMounts:
      - name: semantic-delta-test-script
        mountPath: /app
        readOnly: true
      - name: minio-tenant-env
        mountPath: /var/run/minio-tenant/config.env
        subPath: config.env
        readOnly: true
  executor:
    cores: 1
    instances: 1
    memory: 1g
    labels:
      version: 3.5.3
    env:
      - name: MINIO_CONFIG_ENV_FILE
        value: /var/run/minio-tenant/config.env
    volumeMounts:
      - name: semantic-delta-test-script
        mountPath: /app
        readOnly: true
      - name: minio-tenant-env
        mountPath: /var/run/minio-tenant/config.env
        subPath: config.env
        readOnly: true
