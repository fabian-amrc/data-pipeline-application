- op: add
  path: /spec/deps
  value:
    packages:
      - io.delta:delta-spark_2.12:3.2.1
      - io.unitycatalog:unitycatalog-spark_2.12:0.2.1

- op: add
  path: /spec/sparkConf
  value:
    spark.jars.ivy: /tmp/.ivy2
    spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.sql.catalog.unity: io.unitycatalog.spark.UCSingleCatalog
    spark.sql.catalog.unity.uri: http://unity-catalog-unitycatalog-server.unity-catalog.svc.cluster.local:8080
    spark.sql.catalog.unity.token: ""
    spark.sql.defaultCatalog: unity
    spark.driver.extraJavaOptions: -Duser.name=spark
    spark.executor.extraJavaOptions: -Duser.name=spark
    spark.executorEnv.HADOOP_USER_NAME: spark
    spark.executorEnv.USER: spark
    spark.executorEnv.LOGNAME: spark
