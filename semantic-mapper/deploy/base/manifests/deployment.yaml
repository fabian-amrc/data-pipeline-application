apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-mapper-api
  labels:
    app.kubernetes.io/name: semantic-mapper
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-mapper
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-mapper
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: semantic-layer
    spec:
      containers:
        - name: api
          image: data-pipeline-semantic-mapper:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: ONTOLOGY_ID
              value: manufacturing-rdl
            - name: SEMANTIC_MAPPER_STATE_DIR
              value: /semantic-mapper/state
            - name: SEMANTIC_MAPPER_RESOURCES_DIR
              value: /app/resources
            - name: ONTOLOGY_DIR
              value: /app/resources/ontology
            - name: IDENTIFIER_SCHEMES_FILE
              value: /app/resources/ontology/identifier-schemes.json
            - name: FUSEKI_DATA_URL
              value: http://fuseki.fuseki.svc.cluster.local:3030/semantic/data
            - name: FUSEKI_PING_URL
              value: http://fuseki.fuseki.svc.cluster.local:3030/$/ping
            - name: FUSEKI_USERNAME
              value: admin
            - name: FUSEKI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fuseki-admin
                  key: password
            - name: MAPPINGS_GRAPH_IRI
              value: https://data-pipeline.local/graph/mappings
            - name: UNITY_CATALOG_API_URL
              value: http://unity-catalog-unitycatalog-server.unity-catalog.svc.cluster.local:8080/api/2.1/unity-catalog
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: state
              mountPath: /semantic-mapper/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: semantic-mapper-state
