apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semantic-mapper
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: data-pipeline
  source:
    repoURL: https://github.com/fabian-amrc/data-pipeline-application.git
    targetRevision: main
    path: semantic-mapper/deploy/base
  destination:
    server: https://kubernetes.default.svc
    namespace: semantic-mapper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
