apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: semantic-mapper
resources:
  - manifests/namespace.yaml
  - manifests/deployment.yaml
  - manifests/service.yaml
  - manifests/pvc.yaml
  - manifests/fuseki-admin-secret.yaml

configMapGenerator:
  - name: semantic-mapper-script
    files:
      - api.py=mapper/api.py
      - lib_init.py=mapper/lib/__init__.py
      - clients_init.py=mapper/lib/clients/__init__.py
      - fuseki_client.py=mapper/lib/clients/fuseki.py
      - unity_catalog_client.py=mapper/lib/clients/unity_catalog.py
      - mapping_init.py=mapper/lib/mapping/__init__.py
      - mapping_generator.py=mapper/lib/mapping/generator.py
      - rdf_init.py=mapper/lib/rdf/__init__.py
      - rdf_files.py=mapper/lib/rdf/files.py
      - rml_parser.py=mapper/lib/rdf/rml.py
      - storage.py=mapper/lib/storage.py
  - name: semantic-ontology
    files:
      - core.ttl=ontology/core.ttl
      - identifier-schemes.json=ontology/identifier-schemes.json
  - name: semantic-shapes
    files:
      - ontology-quality.shacl.ttl=shapes/ontology-quality.shacl.ttl

generatorOptions:
  disableNameSuffixHash: true
