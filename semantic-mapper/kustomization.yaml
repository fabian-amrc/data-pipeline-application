apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: semantic-mapper
resources:
  - manifests/namespace.yaml
  - manifests/job.yaml
  - manifests/fuseki-admin-secret.yaml

configMapGenerator:
  - name: semantic-mapper-script
    files:
      - semantic_mapper.py=mapper/semantic_mapper.py
      - semantic_lib_init.py=mapper/lib/__init__.py
      - semantic_config.py=mapper/lib/semantic_config.py
      - semantic_files.py=mapper/lib/semantic_files.py
      - semantic_fuseki.py=mapper/lib/semantic_fuseki.py
      - semantic_rdf.py=mapper/lib/semantic_rdf.py
      - semantic_unity_catalog.py=mapper/lib/semantic_unity_catalog.py
  - name: semantic-ontology
    files:
      - core.ttl=ontology/core.ttl
  - name: semantic-mappings
    files:
      - example-dataset.rml.ttl=mappings/rml/example-dataset.rml.ttl
  - name: semantic-shapes
    files:
      - ontology-quality.shacl.ttl=shapes/ontology-quality.shacl.ttl

generatorOptions:
  disableNameSuffixHash: true
