[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-mapper"
version = "0.1.0"
description = "Semantic Mapper REST API and Python DSL client"
requires-python = ">=3.12"
dependencies = [
  "uvicorn>=0.30,<1",
]

[project.scripts]
semantic-mapper-api = "semantic_mapper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
